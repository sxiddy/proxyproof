# One-click deploy of the API on Render (free tier). See README > "Hosting the server".
services:
  - type: web
    name: proxyproof-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANISER_CODE
        value: STAFF-2026
      - key: SEED_DEMO
        value: "true"
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: proxyproof-db
          property: connectionString

  # Browser demo of the app (no Bluetooth in browsers; see README).
  - type: web
    name: proxyproof-demo
    runtime: static
    rootDir: app
    buildCommand: npm ci && npx expo export -p web --output-dir dist
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: proxyproof-db
    plan: free
