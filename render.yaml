# One-click deploy of the API on Render (free tier). See README > "Hosting the server".
services:
  - type: web
    name: proxyproof-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANISER_CODE
        value: STAFF-2026
      - key: SEED_DEMO
        value: "true"
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: proxyproof-db
          property: connectionString

databases:
  - name: proxyproof-db
    plan: free
